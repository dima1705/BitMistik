plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
   id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def releaseStoreFile = keystoreProperties.getProperty('storeFile') != null
    ? rootProject.file(keystoreProperties.getProperty('storeFile'))
    : null
def hasReleaseKeystore = releaseStoreFile != null && releaseStoreFile.exists()

// Google Maps key — keep out of git. Put MAPS_API_KEY in android/local.properties
// or android/key.properties (both are gitignored).
def mapsApiKey = localProperties.getProperty('MAPS_API_KEY')
if (mapsApiKey == null || mapsApiKey.isEmpty()) {
    mapsApiKey = keystoreProperties.getProperty('MAPS_API_KEY')
}
if (mapsApiKey == null) {
    mapsApiKey = ''
}

android {
    namespace "com.bitMystic.app"
    compileSdkVersion 36

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lint {
        disable 'InvalidPackage'
        checkReleaseBuilds true
        abortOnError false
    }

    defaultConfig {
        applicationId "com.bitMystic.app"
        // firebase_auth requires API 23+
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties.getProperty('keyAlias')
            keyPassword keystoreProperties.getProperty('keyPassword')
            storeFile releaseStoreFile
            storePassword keystoreProperties.getProperty('storePassword')
        }
    }

    buildTypes {
        release {
            if (!hasReleaseKeystore) {
                throw new GradleException(
                    "Release keystore not found. Run scripts/generate-android-keystore.ps1 " +
                    "or create android/key.properties (see key.properties.example)."
                )
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
}
